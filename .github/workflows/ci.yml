name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - run: python scripts/check_doc_sync.py

  build-windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[build]"
      # Chocolatey is preinstalled on windows-latest and its innosetup package
      # provides the ISCC shim, so no third-party action is needed.
      - run: choco install innosetup -y --no-progress
      - name: Ensure ISCC.exe is on PATH
        shell: pwsh
        run: |
          if (Get-Command ISCC.exe -ErrorAction SilentlyContinue) { exit 0 }
          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6",
            "$env:ProgramFiles\Inno Setup 6",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6"
          )
          $inno = $paths | Where-Object { Test-Path (Join-Path $_ "ISCC.exe") } | Select-Object -First 1
          if (-not $inno) { throw "ISCC.exe was not found after installing Inno Setup." }
          Add-Content -Path $env:GITHUB_PATH -Value $inno
      - run: python scripts/build_windows.py
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/windows/Reduvid-Setup-*.exe
          if-no-files-found: error
