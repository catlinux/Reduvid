name: Error / Bug report
description: Algo no funciona como debería · Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Si es un problema de seguridad, no lo publiques aquí: mira SECURITY.md.
        Thanks for reporting. If it is a security issue, don't post it here: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: Qué ha pasado · What happened
      description: Qué esperabas y qué ha ocurrido · What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo · Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de Reduvid · Reduvid version
      description: "reduvid --version"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Sistema · Operating system
      placeholder: Debian 13, Windows 11...
    validations:
      required: true
  - type: textarea
    id: ffmpeg
    attributes:
      label: Versión de FFmpeg · FFmpeg version
      description: Primera línea de «ffmpeg -version» · First line of "ffmpeg -version"
      render: text
  - type: textarea
    id: details
    attributes:
      label: Detalles técnicos · Technical details
      description: Lo que muestra «Ver detalles técnicos» o la salida de la CLI · What "Show technical details" or the CLI output shows
      render: text
